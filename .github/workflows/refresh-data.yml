name: Refresh dashboard data
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dashboard-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check refresh logic
        run: python3 scripts/check-refresh.py
      - name: Refresh public repository projection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh-data.py
